[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcc-atlas-transfer"
version = "0.1.0"
description = "Reproducible multi-atlas response transfer and dual-moment count generation for VCC"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "pandas>=2.2,<4", "anndata>=0.11,<0.14", "h5py>=3.11,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "build>=1"]
extract = ["pyarrow>=16", "google-crc32c>=1.5", "slafdb"]
compact = ["numba>=0.61"]

[project.scripts]
vcc-atlas = "vcc_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
